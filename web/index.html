<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Moazan Traders Kamoke - Online Digital Khata">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Moazan Traders">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Moazan Traders - Digital Khata</title>
  <link rel="manifest" href="manifest.json">
  <script>
    let _moazanDeferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      _moazanDeferredPrompt = e;
      window.dispatchEvent(new Event('moazan-install-ready'));
    });
    window.addEventListener('appinstalled', () => {
      _moazanDeferredPrompt = null;
      window.dispatchEvent(new Event('moazan-installed'));
    });
    window.moazanIsStandalone = function () {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true;
    };
    window.moazanCanPromptInstall = function () {
      return _moazanDeferredPrompt !== null;
    };
    window.moazanTriggerInstall = async function () {
      if (!_moazanDeferredPrompt) return false;
      _moazanDeferredPrompt.prompt();
      const { outcome } = await _moazanDeferredPrompt.userChoice;
      _moazanDeferredPrompt = null;
      return outcome === 'accepted';
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
